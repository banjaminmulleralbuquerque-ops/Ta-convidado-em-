<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tá convidado! 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d8c4ff, #b9e7ff);
      color: #3b245c;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .convite {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(70, 40, 100, 0.2);
    }

    .emoji {
      font-size: 55px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
      color: #7b42c5;
    }

    h2 {
      font-size: 25px;
      margin: 8px 0 25px;
    }

    .idade {
      font-size: 24px;
      font-weight: bold;
      background: #eee1ff;
      padding: 12px;
      border-radius: 18px;
      margin: 20px 0;
    }

    .info {
      font-size: 19px;
      line-height: 1.7;
      margin: 20px 0;
    }

    .botao {
      display: inline-block;
      margin-top: 15px;
      padding: 15px 25px;
      background: #7b42c5;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    .botao:hover {
      background: #6330a5;
    }

    .final {
      margin-top: 25px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="convite">

    <div class="emoji">🎉💜🎂</div>

    <h1>Tá convidado!</h1>

    <h2>para comemorar meu aniversário 🥳</h2>

    <div class="idade">
      Vou fazer 10 anos! 🎈
    </div>

    <div class="info">
      📅 <b>12 de outubro</b><br>
      📍 <b>Rio de Janeiro</b><br>
      📍 <b>No PARME</b>
    </div>

    <a class="botao" href="#">
      💜 Eu vou!
    </a>

    <div class="final">
      Espero você para comemorar comigo! ✨
    </div>

  </div>

</body>
</html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=width-device, initial-scale=1.0">
    <title>Tá convidado! 💜</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7000ff, #bc00dd); /* Seu fundo degradê */
            color: #3b245c;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Deixa o botão alinhado certinho */
        }

        /* Estilo do seu botão roxo */
        .botao-confirmar {
            background-color: #8A2BE2; 
            color: white;
            border: none;
            padding: 15px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .botao-confirmar:hover {
            background-color: #6A1B9A;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Botão que muda de texto ao ser clicado -->
    <button class="botao-confirmar" id="btnConvite" onclick="confirmar()">
        Confirmar Presença
    </button>

    <script>
        function confirmar() {
            document.getElementById("btnConvite").innerText = "Eu vou!";
        }
    </script>

</body>
</html>
<button onclick="confirmarPresenca()">EU VOU! 💜</button>

<script>
function confirmarPresenca() {
  const mensagem = "Oi! Eu vou ao aniversário! 🎉💜";
  const numero = "5524974058995";

  window.open(
    "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem),
    "_blank"
  );
}
</script>
